
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ejercicio 2 - Nombres</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main class="contenedor">

        <h1>Formulario de Nombres</h1>

        <form method="POST">

            <label for="nombre1">Nombre 1:</label>
            <input type="text" id="nombre1"
                   name="nombre1" required>

            <label for="nombre2">Nombre 2:</label>
            <input type="text" id="nombre2"
                   name="nombre2" required>

            <label for="nombre3">Nombre 3:</label>
            <input type="text" id="nombre3"
                   name="nombre3" required>

            <button type="submit" class="boton">
                Enviar
            </button>

        </form>

        {% if resultado %}
        <div class="resultado">
            <h2>Resultado</h2>

            <p>El nombre con mayor cantidad
               de caracteres es:
               <strong>{{ resultado.nombre }}</strong>
            </p>

            <p>El nombre tiene
               <strong>{{ resultado.cantidad }}</strong>
               caracteres.
            </p>
        </div>
        {% endif %}

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <p>
            <a href="{{ url_for('inicio') }}">
                Volver al menú principal
            </a>
        </p>

    </main>

</body>
</html>
